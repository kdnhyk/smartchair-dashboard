<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Chair Dashboard</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 1.6rem; margin-bottom: 8px; color: #fff; }

  .conn-status {
    font-size: 0.85rem;
    margin-bottom: 20px;
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: 600;
  }
  .conn-status.connecting { background: #2d2d2d; color: #ffd43b; }
  .conn-status.ok { background: #1b4332; color: #95d5b2; }
  .conn-status.fail { background: #3d1111; color: #ff6b6b; }

  .status {
    font-size: 0.95rem;
    margin-bottom: 24px;
    padding: 6px 18px;
    border-radius: 20px;
    font-weight: 600;
    transition: all 0.3s;
  }
  .status.on  { background: #1b4332; color: #95d5b2; }
  .status.off { background: #2d2d2d; color: #888; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    width: 100%;
    max-width: 500px;
    margin-bottom: 24px;
  }
  .card {
    background: #1a1d27;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    border: 1px solid #2a2d3a;
    transition: border-color 0.3s;
  }
  .card.active { border-color: #4dabf7; }
  .card .label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
    margin-bottom: 8px;
  }
  .card .time {
    font-size: 1.8rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-family: 'Courier New', monospace;
  }
  .card.now .time  { color: #4dabf7; }
  .card.last .time { color: #ffd43b; }
  .card.total .time { color: #69db7c; }
  .card.best .time  { color: #ff6b6b; }

  .sensors {
    width: 100%;
    max-width: 500px;
    background: #1a1d27;
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #2a2d3a;
  }
  .sensors h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
    margin-bottom: 14px;
  }
  .bar-group { margin-bottom: 10px; }
  .bar-group:last-child { margin-bottom: 0; }
  .bar-label {
    font-size: 0.75rem;
    color: #aaa;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .bar-bg {
    width: 100%;
    height: 10px;
    background: #2a2d3a;
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.3s;
    background: #4dabf7;
  }
  .bar-fill.over { background: #ff6b6b; }
</style>
</head>
<body>
  <h1>Smart Chair</h1>
  <div class="conn-status connecting" id="conn">MQTT 연결 중...</div>
  <div class="status off" id="status">NOT SITTING</div>

  <div class="grid">
    <div class="card now" id="card-now">
      <div class="label">Now</div>
      <div class="time" id="now">00:00:00</div>
    </div>
    <div class="card last">
      <div class="label">Last</div>
      <div class="time" id="last">00:00:00</div>
    </div>
    <div class="card total">
      <div class="label">Total</div>
      <div class="time" id="total">00:00:00</div>
    </div>
    <div class="card best">
      <div class="label">Best</div>
      <div class="time" id="best">00:00:00</div>
    </div>
  </div>

  <div class="sensors">
    <h2>Pressure Sensors</h2>
    <div class="bar-group">
      <div class="bar-label"><span>Sensor 1</span><span id="v1">0</span></div>
      <div class="bar-bg"><div class="bar-fill" id="b1" style="width:0%"></div></div>
    </div>
    <div class="bar-group">
      <div class="bar-label"><span>Sensor 2</span><span id="v2">0</span></div>
      <div class="bar-bg"><div class="bar-fill" id="b2" style="width:0%"></div></div>
    </div>
    <div class="bar-group">
      <div class="bar-label"><span>Sensor 3</span><span id="v3">0</span></div>
      <div class="bar-bg"><div class="bar-fill" id="b3" style="width:0%"></div></div>
    </div>
  </div>

<script>
var TOPIC = 'smartchair/01works_chair';

var client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

client.on('connect', function() {
  document.getElementById('conn').textContent = 'MQTT 연결됨';
  document.getElementById('conn').className = 'conn-status ok';
  client.subscribe(TOPIC);
});

client.on('error', function() {
  document.getElementById('conn').textContent = 'MQTT 연결 실패';
  document.getElementById('conn').className = 'conn-status fail';
});

client.on('offline', function() {
  document.getElementById('conn').textContent = 'MQTT 연결 끊김';
  document.getElementById('conn').className = 'conn-status fail';
});

client.on('message', function(topic, message) {
  var d = JSON.parse(message.toString());

  document.getElementById('now').textContent = fmt(d.now);
  document.getElementById('last').textContent = fmt(d.last);
  document.getElementById('total').textContent = fmt(d.total);
  document.getElementById('best').textContent = fmt(d.best);

  var st = document.getElementById('status');
  var cn = document.getElementById('card-now');
  if (d.sitting) {
    st.textContent = 'SITTING';
    st.className = 'status on';
    cn.classList.add('active');
  } else {
    st.textContent = 'NOT SITTING';
    st.className = 'status off';
    cn.classList.remove('active');
  }

  document.getElementById('v1').textContent = d.s1;
  document.getElementById('v2').textContent = d.s2;
  document.getElementById('v3').textContent = d.s3;
  updateBar('b1', d.s1);
  updateBar('b2', d.s2);
  updateBar('b3', d.s3);
});

function fmt(ms) {
  var s = Math.floor(ms / 1000);
  var h = Math.floor(s / 3600);
  var m = Math.floor((s % 3600) / 60);
  s = s % 60;
  return String(h).padStart(2,'0') + ':' +
         String(m).padStart(2,'0') + ':' +
         String(s).padStart(2,'0');
}

function updateBar(id, val) {
  var pct = Math.min(val / 4095 * 100, 100);
  var el = document.getElementById(id);
  el.style.width = pct + '%';
  el.className = val > 300 ? 'bar-fill over' : 'bar-fill';
}
</script>
</body>
</html>
